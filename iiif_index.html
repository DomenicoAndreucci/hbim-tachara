<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IIIF Manifests – HBIM Tachara</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:1rem}
table{border-collapse:collapse;width:100%;margin-top:1rem}
th,td{border:1px solid #ddd;padding:.5rem;vertical-align:top}
th{background:#f7f7f7;text-align:left}
input{padding:.4rem .6rem;border:1px solid #bbb;border-radius:.4rem}
</style>
</head>
<body>
<h1>IIIF Manifests – HBIM Tachara</h1>
<input id="filter" placeholder="Filter GUID..." />
<table id="tbl" hidden>
  <thead><tr><th>GUID</th><th>Manifest URL</th><th>Open</th></tr></thead>
  <tbody></tbody>
</table>
<script>
async function loadCSV(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) return [];
  const t = await r.text();
  const rows = t.split(/\r?\n/).filter(Boolean);
  const head = rows.shift().split(',').map(s=>s.trim());
  return rows.map(line=>{
    const c = line.split(','); const o={};
    head.forEach((h,i)=> o[h] = (c[i]||'').trim());
    return o;
  });
}
const tbody = document.querySelector('#tbl tbody');
const filter = document.getElementById('filter');

let data = [];
function render(){
  const q = (filter.value||'').toLowerCase();
  tbody.innerHTML = '';
  data.filter(r=> !q || (r.ifc_guid||'').toLowerCase().includes(q))
      .forEach(r=>{
        const tr = document.createElement('tr');
        const m  = r.manifest_url;
        const openUrl = `./mirador.html?manifest=${encodeURIComponent(m)}`;
        tr.innerHTML = `<td><code>${r.ifc_guid||''}</code></td>
                        <td><a href="${m}" target="_blank" rel="noopener">${m}</a></td>
                        <td><a href="${openUrl}" target="_blank" rel="noopener">Open in Mirador</a></td>`;
        tbody.appendChild(tr);
      });
  document.getElementById('tbl').hidden = data.length===0;
}
loadCSV('./manifests_map.csv').then(rows => { data = rows; render(); });
filter.addEventListener('input', render);
</script>
</body>
</html>
